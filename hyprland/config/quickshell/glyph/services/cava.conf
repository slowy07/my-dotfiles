# cava для шелла: 8 полос в stdout, числа 0…100 через ;
[general]
bars = 8
framerate = 30

[input]
method = pipewire
source = auto

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 77
monstercat = 1
