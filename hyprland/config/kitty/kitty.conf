font_family      JetBrainsMono Nerd Font
font_size 13
modify_font cell_width 90%
modify_font cell_height 110%

background_opacity 1
window_padding_width 18 20
confirm_os_window_close 0
shell fish

foreground #dadada
background #141b1e
cursor #dadada
cursor_text_color #141b1e

selection_foreground #141b1e
selection_background #b3b9b8
url_color #67b0e8

active_border_color #dadada
inactive_border_color #b3b9b8

active_tab_foreground #141b1e
active_tab_background #dadada
inactive_tab_foreground #b3b9b8
inactive_tab_background #232a2d
tab_bar_background #141b1e

# Black / Lighter Background
color0 #232a2d
color8 #b3b9b8

# Red
color1 #e57474
color9 #e57474

# Green
color2 #8ccf7e
color10 #8ccf7e

# Yellow
color3 #e5c76b
color11 #e5c76b

# Blue
color4 #67b0e8
color12 #67b0e8

# Magenta
color5 #c47fd5
color13 #c47fd5

# Cyan
color6 #6cbfbf
color14 #6cbfbf

# White / Foreground
color7 #dadada
color15 #dadada

cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 15.0

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_bar_align left

# Tab bar matches terminal background
tab_bar_background #141b1e

# Active tab = Everblush green, dark text for contrast
active_tab_foreground   #141b1e
active_tab_background   #8ccf7e

# Inactive tabs = dim/dark, muted text
inactive_tab_foreground #5b6b6a
inactive_tab_background #1b2225

# Bold active tab label
active_tab_font_style bold
inactive_tab_font_style normal

# поверх цветов выше — только палитра живого шелла (glyph Theme.apply): foreground/background, курсор,
# выделение, вкладки и 16 ANSI. Шрифт, анимации и клавиши остаются здесь.

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

# live colorscheme (glyph: everblush | aphelion) — overrides the colors above
include ~/.config/demonshot/kitty.conf
